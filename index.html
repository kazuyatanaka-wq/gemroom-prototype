function render(){nav();let h='';if(view==='home'){h=`<section class="hero"><div><div class="eyebrow">YOUR CARDS. YOUR STORY.</div><h1>集めたくなる。<br><em>見せたくなる。</em></h1><p>自分だけのカード棚をつくろう。<br>次に狙う1枚も、PSAに出す1枚も。</p><div class="row"><button class="btn" onclick="go('add')">${state.cards.length?'次の1枚を追加する':'自分の棚をつくる'} →</button><button class="textbtn" onclick="go('discover')">カードを見る</button></div><p class="note">登録不要で体験 · 保存先はこのブラウザだけ</p></div><div class="heroArt">${pic(C[2])}${pic(C[3])}${pic(C[0])}<span class="spark">✧</span><div class="float">MY COLLECTION</div></div></section><div class="introgrid"><div class="intro"><span class="icon">▤</span><b>自分だけのカード棚</b><p>お気に入りを並べて、棚ごとシェア。</p></div><div class="intro"><span class="icon">◇</span><b>この1枚、PSAに出す？</b><p>PSA10・9の利益を、費用込みで比較。</p></div><div class="intro"><span class="icon">✧</span><b>次に狙う1枚</b><p>気になるカードは、欲しいリストへ。</p></div></div><section class="section"><div class="between sectionhead"><h2>${state.cards.length?'マイコレクション':'気になるカードを選ぼう'}</h2><button class="textbtn" onclick="go('${state.cards.length?'shelf':'add'}')">${state.cards.length?'棚を見る':'カードを選ぶ'} →</button></div><div class="grid4">${(state.cards.length?state.cards.map(x=>x.id).slice(0,4):[0,1,2,3]).map(i=>tile(i)).join('')}</div></section>`}
if(view==='shelf'){let list=filter==='wish'?state.wishlist:filter==='fav'?state.favorite:state.cards.filter(x=>filter!=='plan'||x.status==='plan').map(x=>x.id);h=`<div class="shelfhero"><div><span class="eyebrow">MY COLLECTION</span><h2>${esc(state.name)}</h2><p>${esc(state.bio)}</p><div class="count"><div><strong>${state.cards.length}</strong>持っている</div><div><strong>${state.favorite.length}</strong>推しカード</div><div><strong>${state.wishlist.length}</strong>欲しい</div></div></div><div class="tinycards">${state.cards.slice(0,3).map(x=>pic(C[x.id])).join('')}</div></div><div class="between section"><div class="row"><button class="btn small" onclick="go('add')">＋ カードを追加</button><button class="btn small light" onclick="editShelf()">棚を編集</button></div><button class="textbtn" onclick="share()">↑ シェア画像を作る</button></div><div class="tabs">${[['all','持ってる'],['fav','♡ 推し'],['wish','欲しい'],['plan','PSA候補']].map(([id,t])=>`<button class="${filter===id?'on':''}" onclick="filter='${id}';render()">${t}</button>`).join('')}</div><div class="shelf ${state.theme}">${list.length?`<div class="grid4">${list.map(i=>tile(i)).join('')}</div>`:`<div class="empty"><span style="font-size:40px">✦</span><strong>まだカードがありません</strong><p>手持ちのカードや、気になるカードを追加できます。</p><button class="btn" onclick="go('${filter==='wish'?'discover':'add'}')">カードを見つける →</button></div>`}</div><p class="note">棚はこのブラウザに保存。端末を変えても残したい時は、設定からバックアップできます。</p>`}
if(view==='add'){h=`<div class="steps"><span class="on">1 カードを選ぶ</span><span>2 内容を確認</span><span>3 マイ棚へ</span></div><h2>カードを追加</h2><p class="sub">カード名・型番を確認して、棚に追加。</p><div class="split"><div class="panel"><h3>写真を確認</h3><div class="upload">${photo?`<img src="${photo}" alt="選択した写真">`:'<span style="font-size:42px">▣</span><p>手元のカード写真を選択</p>'}<input type="file" id="photo" accept="image/*" style="display:none" onchange="uploadPhoto(this)"><button class="btn light" onclick="document.getElementById('photo').click()">写真を選ぶ</button></div><p class="note">写真はサーバーに送信しません。自動識別は未接続なので、表示されているサンプルからカードを選択してください。写真は今回の確認用で、保存データには含まれません。</p></div><div><h3>カード名で探す</h3><input class="search" placeholder="ピカチュウ、ブラッキー…" aria-label="カード名検索" oninput="searchCards(this.value)"><div id="searchResults" class="grid4" style="grid-template-columns:repeat(2,1fr)">${C.map((_,i)=>tile(i,'pick')).join('')}</div><p class="note">体験用の4種類から検索できます。全カード検索は未接続。</p></div></div>`}
if(view==='confirm'){let c=C[selected];h=`<button class="back" onclick="go('add')">← 選び直す</button><div class="steps"><span>1 カードを選ぶ</span><span class="on">2 内容を確認</span><span>3 マイ棚へ</span></div><div class="split"><div class="artstage">${pic(c)}</div><div class="panel"><span class="badge">カード情報を確認</span><h2 style="margin-top:15px">${c.name}</h2><p class="sub">${c.set}<br>${c.code} ／ 日本語版</p><a class="source" target="_blank" rel="noopener" href="${c.source}">公式のカード情報を確認 ↗</a><div class="divider"></div><label class="field">保存先<select id="addstatus"><option value="owned">持っている</option><option value="plan">持っている・PSA候補</option><option value="wish">これから欲しい</option></select></label><label class="field">購入価格（任意・公開しません）<input id="cost" type="number" min="0" step="100" placeholder="例：8000"></label><label class="field">メモ（任意）<textarea id="memo" maxlength="120" placeholder="入手した日、購入店、気に入っているところなど"></textarea></label><button class="btn wide" onclick="addCard()">棚に追加</button></div></div>`}
if(view==='detail'){let c=C[selected],entry=state.cards.find(x=>x.id===selected);h=`<button class="back" onclick="go('shelf')">← マイ棚へ</button><div class="detailtop"><div class="artstage">${pic(c)}</div><div><span class="badge">${c.code} · 日本語版</span><h2 style="margin:12px 0">${c.name}</h2><p class="sub">${c.set}</p><div class="row"><button class="btn small light" onclick="favorite(${selected})">${state.favorite.includes(selected)?'♥ 推しに登録済み':'♡ 推しにする'}</button><button class="btn small light" onclick="wish(${selected})">${state.wishlist.includes(selected)?'✓ 欲しいに登録済み':'＋ 欲しいに入れる'}</button></div><div class="divider"></div><h3>PSAに出す？ そのまま売る？</h3><p class="sub">PSA10・9、それ以外の結果も想定。<br>鑑定費用を引いて、手取りを比較。</p><button class="btn" onclick="startCalc()">鑑定後の損益をみる →</button><p class="note">価格・鑑定枚数は仮のデータ。写真からのグレード予測ではありません。</p><a class="source" href="${c.source}" target="_blank" rel="noopener">カード情報の参照先：公式カード検索 ↗</a></div></div><section class="section panel"><div class="between"><h3>カードメモ</h3>${entry?'<button class="textbtn" onclick="editEntry()">編集する</button>':''}</div>${entry?`<p>${esc(entry.memo||'メモはまだありません。')}</p><p class="note">購入価格：${entry.cost?yen(entry.cost):'未入力'} · ${state.grades[selected]?'鑑定結果：'+esc(state.grades[selected]):'鑑定結果は未登録'}</p><div class="row"><button class="btn small light" onclick="recordGrade()">鑑定結果を記録</button><button class="textbtn" onclick="moveFirst()">棚の先頭に飾る</button></div>`:`<p class="sub">まだ棚にないカードです。</p><button class="btn small" onclick="pick(${selected})">棚に追加 →</button>`}</section>`}
if(view==='calc'){let c=C[selected];h=`<button class="back" onclick="detail(${selected})">← カードに戻る</button><div class="steps"><span class="on">1 条件を入れる</span><span>2 結果を比べる</span><span>3 次の一歩</span></div><h2>鑑定に出す前に、損益を確認。</h2><p class="sub">${c.name} · ${c.code}</p><div class="alert">これは相場・鑑定のシミュレーション。初期値はすべて仮の数字です。</div><form onsubmit="event.preventDefault();calculate()" id="calcform"><div class="split"><div class="panel"><h3>売却価格の想定</h3><p class="note">出品価格ではなく、同じカード・状態の成約価格を確認するのがおすすめ。</p><div class="fields">${num('raw','未鑑定の売却価格',sim.raw)}${num('p10','PSA10の売却価格',sim.p10)}${num('p9','PSA9の売却価格',sim.p9)}${num('p8','PSA8以下の売却価格',sim.p8)}${num('pn','鑑定不能時の売却価格',sim.pn)}${num('buy','仕入れ・購入価格',sim.buy)}</div><label class="field">今回の比較<select id="mode"><option value="owned" ${sim.mode==='owned'?'selected':''}>持っているカード：今売る vs 鑑定して売る</option><option value="buy" ${sim.mode==='buy'?'selected':''}>購入を検討：仕入れて鑑定する</option></select></label></div><div class="panel"><h3>鑑定・売却にかかる費用</h3><div class="fields">${num('grading','鑑定料（仮）',sim.grading)}${num('shipping','鑑定往復送料・保険等',sim.shipping)}${num('fee','販売手数料（%）',sim.fee,100)}${num('sellship','売却時の送料',sim.sellship)}</div><details class="help"><summary>計算に含むもの・含まないもの</summary>鑑定料・鑑定往復送料等・販売手数料・売却送料を含みます。税金、追加鑑定料、為替、資金拘束は含みません。実際の費用に合わせて入力してください。</details></div></div><section class="section panel"><h3>グレード別の確率を入力</h3><p class="sub">以下はあなたが置く想定です。過去のジェム率から自動設定した確率ではありません。</p><div class="grid4">${num('q10','PSA10になる想定（%）',sim.q10,100)}${num('q9','PSA9になる想定（%）',sim.q9,100)}${num('q8','PSA8以下の想定（%）',sim.q8,100)}${num('qn','鑑定不能の想定（%）',sim.qn,100)}</div><p class="err" id="calcerror" role="alert"></p><details class="help"><summary>ジェム率と、このカードの確率は別</summary>この体験例では、PSA10が800枚／数値評価総数1,000枚＝80%という仮データを使っています。これは集団の過去実績の例で、手元のカードの確率ではありません。実際のPSAデータは未接続です。</details></section><div class="section"><button class="btn wide" type="submit">損益を計算 →</button></div></form>`}

 class="btn" onclick="markPlan()">◇ PSA検討リストへ</button><button class="btn light" onclick="go('shelf')">マイ棚に戻る</button><button class="textbtn" onclick="go('calc')">条件をもう一度確認</button></div></div>`}

if(view==='plan'){let list=state.cards.filter(x=>x.status==='plan');h=`<span class="eyebrow">NEXT SUBMISSION</span><h2>PSAに出す候補</h2><p class="sub">候補をまとめて、状態・費用・損益を確認。</p><div class="split"><div>${list.length?list.map(x=>`<div class="listrow">${pic(C[x.id])}<div class="grow"><b>${C[x.id].name}</b><p>${C[x.id].code}</p><span class="badge">検討中</span></div><button class="btn small light" onclick="selected=${x.id};startCalc()">再チェック</button><button class="iconbtn" aria-label="検討を解除" onclick="unplan(${x.id})">×</button></div>`).join(''):`<div class="panel empty"><strong>候補はまだありません</strong><p>損益を確認したカードを、ここに残せます。</p><button class="btn" onclick="go('add')">カードを選ぶ →</button></div>`}</div><div class="panel"><h3>発送前のチェック</h3><p class="sub">チェックは端末内のみ。発送や申込みは行いません。</p>${['カード番号・言語・加工違いを確認','光を変えて、表面・縁・角を確認','最新の鑑定料金・追加費用を確認','納期と価格下落のリスクを確認'].map(t=>`<label style="display:block;font-size:12px;margin:16px 0"><input type="checkbox"> ${t}</label>`).join('')}<div class="alert">写真だけでは、PSAのグレードは確定できません。</div></div></div><section class="section panel"><h3>鑑定結果をコレクションに残す</h3><p class="sub">返ってきたら、カード詳細から実際の結果を記録できます。結果は本人入力で、PSA証明番号との照合はまだ行いません。</p><button class="btn light small" onclick="go('shelf')">棚からカードを選ぶ →</button></section>`}

function num(id,label,v,max){return `<label class="field">${label}<input id="${id}" type="number" min="0" ${max?'max="'+max+'"':''} step="any" value="${v}" required></label>`}
function searchCards(q){$('#searchResults').innerHTML=C.map((c,i)=>({c,i})).filter(x=>(x.c.name+x.c.code).includes(q)).map(x=>tile(x.i,'pick')).join('')||'<p class="note">該当するカードがありません。この試作で検索できるのは4種類です。</p>'}
function uploadPhoto(input){let f=input.files[0];if(!f)return;if(f.size>10000000){toast('10MB以下の画像を選んでください');return}if(!f.type.startsWith('image/')){toast('画像ファイルを選んでください');return}let r=new FileReader();r.onload=()=>{photo=r.result;render()};r.readAsDataURL(f)}
function pick(i){selected=i;go('confirm')}function detail(i){selected=i;go('detail')}
function addCard(){let status=$('#addstatus').value,cost=Number($('#cost').value)||0,memo=$('#memo').value.trim();if(status==='wish'){if(!state.wishlist.includes(selected))state.wishlist.push(selected);filter='wish'}else{let e=state.cards.find(x=>x.id===selected);if(e){Object.assign(e,{status,cost,memo})}else state.cards.unshift({id:selected,status,cost,memo});filter='all'}save();go('shelf');toast(status==='wish'?'欲しいリストに追加しました':'棚に追加しました')}
function favorite(i){if(!state.cards.some(x=>x.id===i)){toast('先にカードを棚へ追加してください');pick(i);return}state.favorite=state.favorite.includes(i)?state.favorite.filter(x=>x!==i):[...state.favorite,i];save();render()}
function wish(i){state.wishlist=state.wishlist.includes(i)?state.wishlist.filter(x=>x!==i):[...state.wishlist,i];save();render();toast(state.wishlist.includes(i)?'欲しいリストに追加しました':'欲しいリストから外しました')}
function editShelf(){modal(`<h2>棚を編集</h2><p class="sub">棚の名前・紹介文・背景色を変更。</p><label class="field">棚の名前<input id="sname" maxlength="26" value="${esc(state.name)}"></label><label class="field">ひとこと<input id="sbio" maxlength="70" value="${esc(state.bio)}"></label><label class="field">棚の色<select id="stheme"><option value="cream">クリーム</option><option value="lilac">ライラック</option><option value="mint">ミント</option></select></label><button class="btn wide" onclick="state.name=$('#sname').value.trim()||'マイコレクション';state.bio=$('#sbio').value;state.theme=$('#stheme').value;save();closeModal();render()">変更を保存</button>`);$('#stheme').value=state.theme}
function modal(html){$('#over').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><button class="close" aria-label="閉じる" onclick="closeModal()">×</button>${html}</div></div>`}function closeModal(){$('#over').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function editEntry(){let e=state.cards.find(x=>x.id===selected);modal(`<h3>カードメモ</h3><label class="field">思い出<textarea id="ememo" maxlength="120">${esc(e.memo||'')}</textarea></label><label class="field">購入価格<input type="number" min="0" id="ecost" value="${e.cost||0}"></label><button class="btn wide" onclick="updateEntry()">保存する</button><button class="textbtn" onclick="removeCard()">棚から外す</button>`)}
function updateEntry(){let e=state.cards.find(x=>x.id===selected);e.memo=$('#ememo').value;e.cost=Math.max(0,Number($('#ecost').value)||0);save();closeModal();render()}
function removeCard(){if(!confirm('このカードを棚から外しますか？'))return;state.cards=state.cards.filter(x=>x.id!==selected);state.favorite=state.favorite.filter(i=>i!==selected);delete state.grades[selected];save();closeModal();go('shelf')}
function moveFirst(){let e=state.cards.find(x=>x.id===selected);state.cards=state.cards.filter(x=>x.id!==selected);state.cards.unshift(e);save();toast('棚の先頭に移動しました')}
function recordGrade(){modal(`<h2>鑑定結果を記録</h2><p class="sub">返却されたカードのグレードを選択。</p><label class="field">鑑定結果（本人入力）<select id="grade"><option>PSA10</option><option>PSA9</option><option>PSA8以下</option><option>鑑定不能</option></select></label><p class="note">入力内容をPSA公式と照合する機能は未接続です。</p><button class="btn wide" onclick="state.grades[selected]=$('#grade').value;save();closeModal();render();toast(state.grades[selected]==='PSA10'?'PSA10を記録しました':'結果を記録しました')">結果を残す</button>`)}
function startCalc(mode='owned'){let c=C[selected],e=state.cards.find(x=>x.id===selected);sim={raw:c.raw,p10:c.p10,p9:c.p9,p8:Math.round(c.raw*.5),pn:Math.round(c.raw*.3),buy:e?.cost||c.raw,grading:6000,shipping:800,fee:10,sellship:300,q10:60,q9:30,q8:8,qn:2,mode};go('calc')}
function calculate(){let ids=['raw','p10','p9','p8','pn','buy','grading','shipping','fee','sellship','q10','q9','q8','qn'];let n={};for(let id of ids){n[id]=Number($('#'+id).value);if(!Number.isFinite(n[id])||n[id]<0){$('#calcerror').textContent='0以上の数値を入力してください。';return}}if(Math.abs(n.q10+n.q9+n.q8+n.qn-100)>.001){$('#calcerror').textContent='想定確率の合計を100%にしてください。';return}if(n.fee>100){$('#calcerror').textContent='販売手数料は100%以下で入力してください。';return}n.mode=$('#mode').value;sim=n;go('result')}
function net(p,s){return p*(1-s.fee/100)-s.sellship}
function calc(s){let fixed=s.grading+s.shipping,raw=net(s.raw,s),ev=(s.q10*net(s.p10,s)+s.q9*net(s.p9,s)+s.q8*net(s.p8,s)+s.qn*net(s.pn,s))/100-fixed,base=s.mode==='owned'?raw:s.buy,non=s.q9+s.q8+s.qn,th=null,note='';if(non>0){let N=(s.q9*net(s.p9,s)+s.q8*net(s.p8,s)+s.qn*net(s.pn,s))/non,D=net(s.p10,s)-N;if(D>0)th=(base+fixed-N)/D*100;else note='PSA10の手取りが他の結果の平均以下のため、必要率は算出しません。'}else note='10以外の想定が0%なので、必要率は算出できません。';let thresholdText=th===null?'算出不可':th>100?'100%超':th<0?'0%以下':th.toFixed(1)+'%';let down=(s.q10*net(s.p10*.8,s)+s.q9*net(s.p9*.8,s)+s.q8*net(s.p8*.8,s)+s.qn*net(s.pn*.8,s))/100-fixed-base;return{fixed,raw,ev,diff:ev-base,down,thresholdText,thresholdNote:note}}
function markPlan(){let e=state.cards.find(x=>x.id===selected);if(e)e.status='plan';else state.cards.push({id:selected,status:'plan',cost:sim.buy,memo:''});save();go('plan');toast('PSA候補に追加しました')}
function unplan(i){state.cards.find(x=>x.id===i).status='owned';save();render()}
function share(){let ids=(state.favorite.length?state.favorite:state.cards.map(x=>x.id)).slice(0,3);if(!ids.length){toast('先にカードを棚へ追加してください');go('add');return}modal(`<span class="badge">共有プレビュー</span><h3 style="margin-top:12px">コレクションをシェア</h3><div class="shareposter"><div class="eyebrow">${state.favorite.length?'MY FAVORITES':'MY COLLECTION'} / GEMROOM</div><h3>${esc(state.name)}</h3><div class="storycards">${ids.map(i=>pic(C[i])).join('')}</div><p>${esc(state.bio)}</p><span class="badge">${state.favorite.length?'推し':'コレクション'} ${ids.length}枚</span></div><p class="note">購入額・資産額・個人情報は含めません。PNGを保存して自分で共有できます。公開URLの発行機能は未接続です。</p><button class="btn wide" onclick="exportPoster()">棚の画像を保存する ↓</button>`)}
async function exportPoster(){let ids=(state.favorite.length?state.favorite:state.cards.map(x=>x.id)).slice(0,3),can=document.createElement('canvas');can.width=1200;can.height=1200;let ctx=can.getContext('2d'),g=ctx.createLinearGradient(0,0,1200,1200);g.addColorStop(0,'#e8ddff');g.addColorStop(1,'#fff0c7');ctx.fillStyle=g;ctx.fillRect(0,0,1200,1200);ctx.fillStyle='#7653e9';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText((state.favorite.length?'MY FAVORITES':'MY COLLECTION')+'  /  GEMROOM',600,110);ctx.fillStyle='#28223d';ctx.font='bold 55px sans-serif';ctx.fillText(state.name,600,215,1050);let imgs=await Promise.all(ids.map(i=>new Promise(res=>{let im=new Image();im.onload=()=>res(im);im.src=C[i].img})));let w=285,gap=35,start=(1200-(imgs.length*w+(imgs.length-1)*gap))/2;imgs.forEach((im,i)=>{ctx.drawImage(im,start+i*(w+gap),330,w,w*im.height/im.width)});ctx.font='27px sans-serif';ctx.fillText(state.bio,600,900,1040);ctx.font='20px sans-serif';ctx.fillStyle='#807489';ctx.fillText('構想試作 / カード画像の権利は各権利者に帰属',600,1070);can.toBlob(b=>download(new Blob([b],{type:'image/png'}),'my-card-shelf.png'))}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function settings(){modal(`<h2>データと保存先</h2><p class="sub">アカウント不要の試作品です。</p><div class="help">棚・購入価格・メモ・鑑定結果は、このブラウザのローカルストレージに保存。サーバー送信なし。端末間同期・オンライン共有・画像識別・価格APIは未接続です。ブラウザの履歴削除等で消えることがあります。</div><div class="section row"><button class="btn small" onclick="download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'gemroom-backup.json')">バックアップを保存</button><button class="btn small light" onclick="document.getElementById('import').click()">読み込む</button><input id="import" type="file" accept="application/json" hidden onchange="importState(this)"></div><div class="divider"></div><p class="note">この配布版にはポケモンのカード画像を収録していません。一般公開・商用利用前には画像権利とデータ利用条件の確認が必要です。</p><button class="textbtn" onclick="if(confirm('保存した棚データをすべて削除しますか？')){localStorage.removeItem('gemroom-v3');location.reload()}">このブラウザの棚をリセット</button>`)}
function importState(input){let f=input.files[0];if(!f)return;f.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.cards)||!Array.isArray(d.favorite)||!Array.isArray(d.wishlist)||typeof d.name!=='string')throw Error();let ids=x=>Number.isInteger(x)&&x>=0&&x<C.length;state={name:d.name.slice(0,26),bio:String(d.bio||'').slice(0,70),theme:['cream','lilac','mint'].includes(d.theme)?d.theme:'cream',cards:d.cards.filter(x=>ids(x.id)).map(x=>({id:x.id,status:x.status==='plan'?'plan':'owned',cost:Math.max(0,Number(x.cost)||0),memo:String(x.memo||'').slice(0,120)})),wishlist:d.wishlist.filter(ids),favorite:d.favorite.filter(ids),grades:{}};if(d.grades)for(let k in d.grades)if(ids(+k)&&['PSA10','PSA9','PSA8以下','鑑定不能'].includes(d.grades[k]))state.grades[k]=d.grades[k];save();closeModal();go('shelf');toast('バックアップを読み込みました')}catch(e){toast('GEMROOMのバックアップファイルを選択してください')}})}
render();
</script></body></html>
